[package]
name = "reflective_loader"
version = "0.1.0"
edition = "2021"
authors = ["Devin AI"]
description = "A secure file protector with GPU-accelerated packing and reflective loading capabilities"

[dependencies]
anyhow = "1.0"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography", 
    "Win32_System_Diagnostics_Debug", 
    "Win32_System_Memory", 
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus"
]}
tempfile = "3.2"
ocl = { version = "0.19", optional = true }
clap = { version = "4.4", features = ["derive"] }
rand = "0.8"
byteorder = "1.4"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

[features]
encryption = []
gpu-packing = ["ocl"]
runpe = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
